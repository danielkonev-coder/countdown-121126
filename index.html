<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070c18" />
  <meta name="description" content="Разовый обратный отсчёт до 23:59:59 12 ноября 2026 по Сургуту (UTC+5)." />
  <title>12 ноября · До 23:59:59 · Сургут</title>
  <meta property="og:title" content="Обратный отсчёт · 12 ноября" />
  <meta property="og:description" content="До 23:59:59 по Сургуту. Только 12 ноября 2026 года." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070c18;
      --text: #f4f8ff;
      --muted: #8e9eb6;
      --stroke: rgba(168, 194, 227, 0.15);
      --mint: #83f3d2;
      --lilac: #ab9cff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      font-synthesis: none;
      color: var(--text);
      background:
        radial-gradient(ellipse 62% 34% at 5% 12%, rgba(45, 104, 129, 0.23), transparent 78%),
        radial-gradient(ellipse 68% 45% at 105% 100%, rgba(103, 78, 173, 0.22), transparent 78%),
        var(--bg);
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .2;
      background-image: radial-gradient(rgba(210, 230, 255, .5) .7px, transparent .8px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), transparent 90%);
    }
    .shell {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      max-width: 720px; margin: 0 auto;
      padding: calc(30px + env(safe-area-inset-top, 0px)) 22px calc(25px + env(safe-area-inset-bottom, 0px));
    }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; color: #e3edff; letter-spacing: .1em; font-weight: 750; font-size: 12px; }
    .brand-mark {
      display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(145deg, rgba(131,243,210,.19), rgba(171,156,255,.16));
      border: 1px solid rgba(163,230,231,.25);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .live { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .12em; font-weight: 800; color: var(--mint); border: 1px solid rgba(131,243,210,.23); background: rgba(131,243,210,.065); border-radius: 999px; padding: 9px 11px; }
    .live-dot { width: 7px; height: 7px; background: #7ef3cb; border-radius: 50%; box-shadow: 0 0 0 5px rgba(126,243,203,.08), 0 0 12px rgba(126,243,203,.65); animation: livePulse 2.5s infinite; }
    @keyframes livePulse { 50% { opacity: .5; box-shadow: 0 0 0 8px rgba(126,243,203,.025), 0 0 5px rgba(126,243,203,.25); } }
    .center { flex: 1; display: flex; justify-content: center; flex-direction: column; padding: 58px 0 42px; }
    .eyebrow { font-size: 11px; letter-spacing: .25em; color: var(--mint); font-weight: 800; text-transform: uppercase; text-align: center; }
    h1 { margin: 14px 0 0; font-size: clamp(34px, 8vw, 54px); line-height: 1.06; letter-spacing: -.055em; font-weight: 800; text-align: center; }
    h1 span { background: linear-gradient(90deg, #f9fcff 5%, #9deee2 85%); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .subheading { text-align: center; font-size: clamp(14px, 3.3vw, 16px); line-height: 1.5; color: var(--muted); margin: 16px 0 0; }
    .timer-wrap { position: relative; margin-top: 48px; padding: 1px; border-radius: 29px; background: linear-gradient(150deg, rgba(141,240,216,.4), rgba(155,171,232,.1) 48%, rgba(167,142,242,.35)); box-shadow: 0 30px 90px rgba(0,0,0,.3); }
    .timer-panel {
      position: relative; overflow: hidden; border-radius: 28px; padding: clamp(27px, 6vw, 43px) clamp(14px,4vw,38px) 29px;
      background: linear-gradient(138deg, rgba(24,39,56,.97), rgba(13,20,36,.985) 65%, rgba(24,24,47,.97));
    }
    .timer-panel::before { content: ""; position: absolute; left: -20%; top: -65%; width: 80%; height: 110%; background: radial-gradient(circle, rgba(106,236,215,.10), transparent 64%); pointer-events: none; }
    .timer-kicker { position: relative; margin-bottom: 26px; text-align: center; color: #aebbd0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
    .time-grid { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items: start; gap: clamp(2px, 1vw, 9px); }
    .time-unit { min-width: 0; text-align: center; }
    .digits { display: block; font-size: clamp(45px, 12vw, 78px); font-weight: 800; font-variant-numeric: tabular-nums lining-nums; line-height: 1.05; letter-spacing: -.075em; padding-right: .075em; color: #fafcff; text-shadow: 0 3px 25px rgba(180,228,255,.09); }
    .digits.tick { animation: digitTick .35s ease-out; }
    @keyframes digitTick { 0% { transform: translateY(4px); opacity: .65; } 100% { transform: translateY(0); opacity: 1; } }
    .separator { padding-top: .03em; font-size: clamp(39px, 10vw, 66px); font-weight: 250; line-height: 1; color: rgba(131,243,210,.65); }
    .unit-name { display: block; margin-top: 12px; color: #8a9db4; font-size: clamp(10px, 2.8vw, 12px); letter-spacing: .05em; font-weight: 600; }
    .rule { margin: 32px 0 22px; height: 1px; background: linear-gradient(to right, transparent, rgba(178,199,230,.2), transparent); }
    .progress-info { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: #aebbd0; font-size: 12px; }
    .progress-info strong { color: #c8f8e9; font-size: 12px; font-variant-numeric: tabular-nums; }
    .track { margin-top: 13px; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(135,152,190,.17); }
    .track-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #70d7d4, #a993fa); box-shadow: 0 0 14px rgba(120,220,220,.5); transition: width .6s linear; }
    .now { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 28px; padding: 19px 19px; border: 1px solid var(--stroke); border-radius: 17px; background: rgba(127,162,212,.055); }
    .now-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .clock-icon { flex: none; display: grid; place-items: center; height: 37px; width: 37px; border-radius: 11px; background: rgba(173,163,250,.12); color: #bbb1ff; }
    .clock-icon svg { width: 18px; height: 18px; }
    .now-label { color: #9faec2; font-size: 11px; line-height: 1.3; }
    .now-zone { color: #e6edff; font-size: 13px; font-weight: 680; line-height: 1.5; }
    .now-time { white-space: nowrap; color: #f8fbff; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
    .footer { color: #73849e; text-align: center; font-size: 11px; line-height: 1.65; }
    .footer strong { color: #aab9d2; font-weight: 650; }
    .ended .digits { color: #99f1da; }
    .ended .timer-kicker { color: #99f1da; }
    .ended .digits { animation: none !important; }
    .live.finished { color: #bbc8d9; border-color: rgba(168,194,227,.19); background: rgba(168,194,227,.065); }
    .live.finished .live-dot { background: #a4b4c9; animation: none; box-shadow: none; }
    @media (max-width: 360px) { .shell { padding-left: 14px; padding-right: 14px; } .timer-panel { padding-left: 11px; padding-right: 11px; } .digits { font-size: 43px; } .separator { font-size: 39px; } .now { padding: 15px 12px; } .now-time { font-size: 19px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9bf5dd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.8V12l3.7 2.2"/><path d="M5.5 3.2l-2 2"/></svg>
        </span>
        <span>ОБРАТНЫЙ ОТСЧЁТ</span>
      </div>
      <div class="live" id="live"><span class="live-dot" aria-hidden="true"></span><span id="live-text">LIVE</span></div>
    </header>

    <section class="center" aria-label="Обратный отсчёт">
      <div class="eyebrow">12 ноября 2026 · Сургут</div>
      <h1>До <span>23:59:59</span></h1>
      <p class="subheading"><span id="date">Четверг, 12 ноября 2026 года</span><br />По времени Сургута (UTC+5)</p>

      <div class="timer-wrap">
        <div class="timer-panel" id="panel">
          <div class="timer-kicker" id="status" aria-live="polite">Осталось времени</div>
          <div class="time-grid" id="time" role="timer" aria-label="Оставшееся время">
            <div class="time-unit"><span class="digits" id="hours">00</span><span class="unit-name">ЧАСОВ</span></div>
            <span class="separator" aria-hidden="true">:</span>
            <div class="time-unit"><span class="digits" id="minutes">00</span><span class="unit-name">МИНУТ</span></div>
            <span class="separator" aria-hidden="true">:</span>
            <div class="time-unit"><span class="digits" id="seconds">00</span><span class="unit-name">СЕКУНД</span></div>
          </div>
          <div class="rule"></div>
          <div class="progress-info"><span>Путь к 23:59:59</span><strong id="progress-label">0%</strong></div>
          <div class="track" role="progressbar" aria-label="Прогресс до 23:59:59" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div class="track-fill" id="progress-fill"></div></div>
        </div>
      </div>

      <div class="now">
        <div class="now-left">
          <span class="clock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span><span class="now-label">Местное время</span><br /><span class="now-zone">Сургут · UTC+5</span></span>
        </div>
        <span class="now-time" id="now-time">--:--:--</span>
      </div>
    </section>
    <footer class="footer"><strong>DEADLINE · 23:59:59</strong></footer>
  </main>

  <script>
    (() => {
      'use strict';
      // 12.11.2026 в 23:59:59 в Сургуте (UTC+5) = 12.11.2026 18:59:00 UTC.
      // Цель абсолютна и не пересчитывается при смене дня.
      const TARGET_MS = Date.UTC(2026, 10, 12, 18, 59, 59);
      const START_MS = Date.UTC(2026, 10, 11, 19, 0, 0); // 00:00 12 ноября UTC+5
      const OFFSET_MS = 5 * 60 * 60 * 1000;
      const TOTAL_MS = TARGET_MS - START_MS;
      const byId = id => document.getElementById(id);
      const hoursEl = byId('hours');
      const minutesEl = byId('minutes');
      const secondsEl = byId('seconds');
      const timeEl = byId('time');
      const nowEl = byId('now-time');
      const statusEl = byId('status');
      const panelEl = byId('panel');
      const liveEl = byId('live');
      const liveTextEl = byId('live-text');
      const progressEl = byId('progress-fill');
      const progressLabel = byId('progress-label');
      const progressTrack = byId('progress-track');
      const pad = number => String(number).padStart(2, '0');
      let lastSecondsText = '';
      let timerId;
      let finished = false;

      function update() {
        const nowMs = Date.now();
        finished = nowMs >= TARGET_MS;
        const remainingSeconds = finished ? 0 : Math.ceil((TARGET_MS - nowMs) / 1000);
        const hh = Math.floor(remainingSeconds / 3600);
        const mm = Math.floor((remainingSeconds % 3600) / 60);
        const ss = remainingSeconds % 60;
        hoursEl.textContent = pad(hh);
        minutesEl.textContent = pad(mm);
        secondsEl.textContent = pad(ss);
        timeEl.setAttribute('aria-label', finished ? 'Отсчёт завершён' : `Осталось ${hh} часов, ${mm} минут, ${ss} секунд`);
        // После срока замораживаем также часы, чтобы на странице ничего не тикало.
        const displayedMs = finished ? TARGET_MS : nowMs;
        const surgut = new Date(displayedMs + OFFSET_MS);
        nowEl.textContent = `${pad(surgut.getUTCHours())}:${pad(surgut.getUTCMinutes())}:${pad(surgut.getUTCSeconds())}`;

        panelEl.classList.toggle('ended', finished);
        liveEl.classList.toggle('finished', finished);
        liveTextEl.textContent = finished ? 'ЗАВЕРШЕНО' : 'LIVE';
        statusEl.textContent = finished ? 'Время вышло · 12 ноября' : 'Осталось времени';
        const elapsed = Math.min(TOTAL_MS, Math.max(0, nowMs - START_MS));
        const percentage = Math.min(100, Math.max(0, elapsed / TOTAL_MS * 100));
        progressEl.style.width = `${percentage}%`;
        progressLabel.textContent = `${Math.floor(percentage)}%`;
        progressTrack.setAttribute('aria-valuenow', String(Math.floor(percentage)));

        const newSecondsText = pad(ss);
        if (!finished && lastSecondsText && lastSecondsText !== newSecondsText) {
          secondsEl.classList.remove('tick');
          void secondsEl.offsetWidth;
          secondsEl.classList.add('tick');
        } else if (finished) {
          secondsEl.classList.remove('tick');
        }
        lastSecondsText = newSecondsText;
        if (finished) window.clearTimeout(timerId);
      }

      function loop() {
        update();
        if (!finished) {
          // Синхронизируем секунды, избегая постепенного ухода таймера.
          timerId = window.setTimeout(loop, 1000 - (Date.now() % 1000) + 25);
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          window.clearTimeout(timerId);
          loop();
        }
      });
      window.addEventListener('pageshow', () => {
        window.clearTimeout(timerId);
        loop();
      });
      loop();
    })();
  </script>
</body>
